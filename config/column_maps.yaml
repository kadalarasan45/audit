# ============================================================
#  Column alias map.
#  LHS  = canonical field name used everywhere in the code.
#  RHS  = every header spelling seen in the wild (Tally exports,
#         HDFC/ICICI/SBI/Axis/Kotak statements, GST portal downloads).
#  Matching is case-insensitive and ignores punctuation/spaces.
#  Add a new alias here instead of touching any Python file.
# ============================================================

